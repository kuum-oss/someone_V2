services:
  db:
    image: mysql:8.3
    container_name: library_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: library_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: library_app_container
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8081"
    environment:
      - DB_URL=jdbc:mysql://db:3306/
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=library_db
    restart: on-failure

volumes:
  db_data:
