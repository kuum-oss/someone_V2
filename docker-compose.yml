services:
  db:
    image: mysql:8.3
    container_name: library_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 74542474
      MYSQL_DATABASE: library_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: library_app_container
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/
      - DB_USER=root
      - DB_PASSWORD=74542474
      - DB_NAME=library_db
    restart: on-failure

volumes:
  db_data:
